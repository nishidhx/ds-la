<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibonacci — Recursive Dry Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e9eef5; --panel: #f8fafc; --ink: #1b2a41; --muted: #5a6b84; --line: #d3dbe7;
  --accent: #2f5bd3; --accent-soft: #dfe7fb; --marker: #ffd66b; --marker-ink: #3a2c00;
  --paused: #eef1e0; --paused-edge: #9aa65a; --code-bg: #f3f6fb;
  --kw: #b0336b; --fn: #2f5bd3; --str: #2f7d4f; --num: #a35a00; --pp: #7b4bb3;
  --pole: #8a97ab; --base: #3d4c66;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a2b; --panel: #15233a; --ink: #e4ebf5; --muted: #93a3bb; --line: #26375a;
    --accent: #7ea0ff; --accent-soft: #1f3563; --marker: #ffd66b; --marker-ink: #2a1f00;
    --paused: #232f22; --paused-edge: #9aa65a; --code-bg: #111d31;
    --kw: #ff8fbf; --fn: #8fb0ff; --str: #7fd6a0; --num: #ffb766; --pp: #c9a2ff;
    --pole: #5d6f8e; --base: #8a9bb8;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a2b; --panel: #15233a; --ink: #e4ebf5; --muted: #93a3bb; --line: #26375a;
  --accent: #7ea0ff; --accent-soft: #1f3563; --marker: #ffd66b; --marker-ink: #2a1f00;
  --paused: #232f22; --paused-edge: #9aa65a; --code-bg: #111d31;
  --kw: #ff8fbf; --fn: #8fb0ff; --str: #7fd6a0; --num: #ffb766; --pp: #c9a2ff;
  --pole: #5d6f8e; --base: #8a9bb8;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.45;
}
#root { height: 100%; }
.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; max-width: 1800px; margin: 0 auto; }

.bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px;
}
.bar h1 { font-size: 1.05rem; margin: 0 6px 0 0; font-weight: 700; white-space: nowrap; }
.group { display: flex; align-items: center; gap: 5px; }
.group > .lbl { color: var(--muted); font-size: 0.82rem; margin-right: 2px; }
button {
  font: inherit; font-size: 0.88rem; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; cursor: pointer; min-width: 32px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button.play { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 70px; font-weight: 600; }
.scrub { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 180px; }
.scrub input { flex: 1; }
input[type=range] { accent-color: var(--accent); }
.stepno { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.82rem; white-space: nowrap; }

.main {
  flex: 1; min-height: 0; display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.72fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr);
  grid-template-areas: "rods side code" "tree tree tree";
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel-head {
  flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 5px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 0.88rem;
}
.panel-head small { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.body { flex: 1; min-height: 0; overflow: auto; }

.rods { grid-area: rods; }
.stage { position: relative; flex: 1; min-height: 90px; margin: 8px 12px 0; }
.pole { position: absolute; width: 7px; background: var(--pole); border-radius: 4px 4px 0 0; }
.base { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--base); border-radius: 4px; }
.disk {
  position: absolute; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 0.76rem; font-family: "JetBrains Mono", ui-monospace, monospace;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
  transition: left 0.5s cubic-bezier(.5,0,.3,1), bottom 0.5s cubic-bezier(.2,.9,.3,1); z-index: 2;
}
.disk.moved { outline: 3px solid var(--marker); outline-offset: 1px; z-index: 3; }
.rodlabels { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px 12px 6px; text-align: center; font-size: 0.85rem; }
.rodlabels .nm { font-weight: 600; }
.chip { display: inline-block; margin-left: 5px; font-size: 0.7rem; padding: 0 6px; border-radius: 999px; font-family: "JetBrains Mono", ui-monospace, monospace; }
.chip.from { background: #fde2e2; color: #9b1c1c; }
.chip.to { background: #dcf5e6; color: #146c3c; }
.chip.aux { background: #e6e3fb; color: #4b3aa8; }
.narration { flex: none; display: flex; gap: 10px; align-items: flex-start; padding: 7px 12px; border-top: 1px solid var(--line); height: 5.4em; overflow: auto; font-size: 0.86rem; }
.narration p { margin: 0; }
.linebadge { flex: none; background: var(--marker); color: var(--marker-ink); border-radius: 5px; padding: 1px 7px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.76rem; font-weight: 700; }
.linebadge.none { background: var(--accent-soft); color: var(--ink); }

.side { grid-area: side; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-height: 0; }
.stack { padding: 7px 9px; display: flex; flex-direction: column; gap: 5px; }
.frame { border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.74rem; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.frame.active { border-color: var(--accent); background: var(--accent-soft); }
.frame .cnt { color: var(--muted); }
.frame .wait { color: var(--muted); font-size: 0.7rem; width: 100%; }
.empty { color: var(--muted); font-size: 0.82rem; padding: 2px; }
.console { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.74rem; padding: 7px 9px; background: var(--code-bg); }
.console div { white-space: nowrap; padding: 0 4px; border-radius: 4px; }
.console .fresh { background: var(--marker); color: var(--marker-ink); }
.console .num { color: var(--muted); display: inline-block; width: 2.3em; }

.codep { grid-area: code; }
.vars { display: flex; gap: 5px; flex-wrap: wrap; }
.var { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.74rem; font-weight: 500; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.var b { font-weight: 700; }
.var.ret { border-color: #29a36a; background: #29a36a; color: #fff; }
.code {
  background: var(--code-bg); padding: 4px 0;
  font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace;
  font-size: clamp(11px, 1.75vh, 15px); line-height: 1.45;
}
.ln { display: flex; min-width: max-content; padding-right: 12px; border-left: 4px solid transparent; transition: background 0.2s; }
.ln.blank { height: 0.45em; }
.ln .g { width: 2.8em; text-align: right; padding-right: 12px; color: var(--muted); user-select: none; flex: none; }
.ln pre { margin: 0; font: inherit; white-space: pre; }
.ln.paused { background: var(--paused); border-left-color: var(--paused-edge); }
.ln.active { background: var(--marker); border-left-color: #d49b00; color: var(--marker-ink); }
.ln.active .g { color: var(--marker-ink); font-weight: 700; }
.ln.active span { color: var(--marker-ink) !important; }
.tk-kw { color: var(--kw); font-weight: 500; } .tk-fn { color: var(--fn); } .tk-str { color: var(--str); } .tk-num { color: var(--num); } .tk-pp { color: var(--pp); }

.treep { grid-area: tree; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.76rem; color: var(--muted); font-weight: 500; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.treebox { position: relative; flex: 1; min-height: 0; }
.treebox svg { position: absolute; inset: 4px 6px; width: calc(100% - 12px); height: calc(100% - 8px); }
.t-edge { stroke: var(--line); stroke-width: 2; fill: none; transition: stroke 0.3s; }
.t-edge.live { stroke: var(--accent); stroke-width: 2.5; }
.t-elbl { font: 500 11px "JetBrains Mono", ui-monospace, monospace; fill: var(--muted); }
.t-node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; transition: fill 0.3s, stroke 0.3s; }
.t-node.stack rect { fill: var(--accent-soft); stroke: var(--accent); }
.t-node.active rect { fill: var(--marker); stroke: #d49b00; stroke-width: 2.5; }
.t-node.done rect { fill: var(--code-bg); }
.t-call { font: 700 12.5px "JetBrains Mono", ui-monospace, monospace; fill: var(--ink); }
.t-sub { font: 500 11px "JetBrains Mono", ui-monospace, monospace; fill: var(--muted); }
.t-node.active .t-call, .t-node.active .t-sub { fill: var(--marker-ink); }
.t-ret circle { fill: #29a36a; }
.t-ret text { font: 700 11px "JetBrains Mono", ui-monospace, monospace; fill: #fff; }
.t-appear { animation: grow 0.35s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes grow { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }

@media (max-width: 899px), (max-height: 520px) {
  body { overflow: auto; }
  #root, .app { height: auto; }
  .main { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "rods" "code" "tree" "side"; }
  .stage { flex: none; height: 210px; }
  .side { grid-template-rows: auto; grid-auto-rows: 200px; }
  .treebox { flex: none; height: 300px; }
}
@media (prefers-reduced-motion: reduce) { .disk, .ln, .t-node rect, .t-edge { transition: none; } .t-appear { animation: none; } }

.state { grid-area: rods; }
.main { grid-template-rows: minmax(0, 1.32fr) minmax(0, 1fr); }
.code { font-size: clamp(10.5px, 1.6vh, 15px); line-height: 1.38; }
.ln.blank { height: 0.35em; }
.tk-cm { color: var(--muted); font-style: italic; }
.seq { flex: none; display: flex; gap: 6px; padding: 10px 12px 4px; }
.cell { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 3px 0; transition: background 0.3s; }
.cell .k { font: 500 0.7rem "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
.cell .v { font: 700 1.15rem "JetBrains Mono", ui-monospace, monospace; min-height: 1.45em; }
.cell.done { background: var(--code-bg); }
.cell.cur { background: var(--marker); border-color: #d49b00; color: var(--marker-ink); }
.cell.cur .k { color: var(--marker-ink); }
.cell.fresh { outline: 3px solid #29a36a; outline-offset: 1px; }
.barsWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 12px 8px; }
.barsTitle { flex: none; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.barsTitle b { color: var(--ink); }
.bars { flex: 1; min-height: 50px; display: flex; align-items: stretch; gap: 8px; border-bottom: 2px solid var(--base); padding-top: 6px; }
.cbar { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.cbar .c { font: 700 0.78rem "JetBrains Mono", ui-monospace, monospace; margin-bottom: 2px; }
.cbar .fill { width: 100%; max-width: 60px; background: var(--accent); border-radius: 5px 5px 0 0; transition: height 0.35s; }
.cbar .fill.hot { background: var(--marker); box-shadow: inset 0 0 0 2px #d49b00; }
.barlbls { flex: none; display: flex; gap: 8px; padding-top: 3px; }
.barlbls span { flex: 1; min-width: 0; text-align: center; font: 500 0.72rem "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
.noTree { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem; }
.term .prompt { color: var(--muted); }
.term .outline { white-space: normal; font-size: 0.95rem; line-height: 1.8; }
.term .outline span { padding: 1px 3px; border-radius: 4px; margin-right: 2px; }
.term .outline span.fresh { background: var(--marker); color: var(--marker-ink); }
.t-node.rep rect { stroke-dasharray: 5 3; }
@media (max-width: 899px), (max-height: 520px) { .barsWrap { flex: none; height: 200px; } }
.sk-foot{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;line-height:1;white-space:nowrap;padding:2px 0 4px;color:var(--muted)}
.sk-fib{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.72rem;font-weight:500;color:var(--ink);padding:0 0 2px}
.sk-fib .sk-bars{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.sk-fib .sk-bars i{width:4px;background:var(--accent);border-radius:1px 1px 0 0}
.sk-fib .sk-bars i:last-child{background:var(--marker)}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
const CODE = [
  '#include <stdio.h>',
  '',
  'int fibonacci(int n) {',
  '',
  '    // Base Case',
  '    if (n == 0)',
  '        return 0;',
  '',
  '    if (n == 1)',
  '        return 1;',
  '',
  '    // Recursive Case',
  '    return fibonacci(n - 1) + fibonacci(n - 2);',
  '}',
  '',
  'int main() {',
  '    int n = 7;',
  '',
  '    for (int i = 0; i < n; i++) {',
  '        printf("%d ", fibonacci(i));',
  '    }',
  '',
  '    return 0;',
  '}'
];

function codeFor(N) {
  return CODE.map((l, i) => i === 16 ? `    int n = ${N};` : l);
}

function buildSteps(N) {
  const steps = [];
  const stack = [];
  const out = [];
  const trees = [];
  let cur = null, curRet = null, noted = false;

  const snap = (lines, msg, extra = {}) => {
    steps.push({
      lines: [].concat(lines),
      msg,
      stack: stack.map(f => ({ ...f })),
      out: out.slice(),
      ti: trees.length - 1,
      seen: cur ? cur.length : 0,
      rets: curRet ? curRet.slice() : [],
      ret: extra.ret != null ? extra.ret : null,
      printed: !!extra.printed
    });
  };

  const rec = (k, via, depth, parent) => {
    const id = cur.length;
    cur.push({ id, k, depth, parent, via, kids: [] });
    if (parent != null) cur[parent].kids.push(id);
    curRet.push(null);
    const f = { k, a: null, b: null, id, via };
    stack.push(f);
    const back = via === 'main' ? 'Control returns to line 20 in main().' : 'Control returns to line 13 of the caller.';
    snap(3, `Enter fibonacci(${k}). A new stack frame is pushed with n = ${k}.`);
    snap(6, k === 0 ? `Check n == 0 → true.` : `Check n == 0 → false (n = ${k}).`);
    if (k === 0) {
      curRet[id] = 0;
      snap(7, `Base case: return 0. The frame is popped. ${back}`, { ret: 0 });
      stack.pop();
      return 0;
    }
    snap(9, k === 1 ? `Check n == 1 → true.` : `Check n == 1 → false (n = ${k}).`);
    if (k === 1) {
      curRet[id] = 1;
      snap(10, `Base case: return 1. The frame is popped. ${back}`, { ret: 1 });
      stack.pop();
      return 1;
    }
    let note = '';
    if (!noted) {
      noted = true;
      note = ' C does not fix which side of + is evaluated first; this trace goes left to right.';
    }
    snap(13, `Recursive case. Evaluate fibonacci(n - 1) = fibonacci(${k - 1}) first; this frame waits.${note}`);
    const a = rec(k - 1, 'n-1', depth + 1, id);
    f.a = a;
    snap(13, `fibonacci(${k - 1}) returned ${a}. Now evaluate fibonacci(n - 2) = fibonacci(${k - 2}); the frame waits again.`);
    const b = rec(k - 2, 'n-2', depth + 1, id);
    f.b = b;
    curRet[id] = a + b;
    snap(13, `fibonacci(${k - 2}) returned ${b}. return ${a} + ${b} = ${a + b}. The frame is popped. ${back}`, { ret: a + b });
    stack.pop();
    return a + b;
  };

  const mainFrame = { main: true, n: N, i: null };
  stack.push(mainFrame);
  snap(16, 'The program starts in main().');
  snap(17, `int n = ${N}. The loop will print the first ${N} Fibonacci number${N > 1 ? 's' : ''}.`);
  for (let i = 0; i < N; i++) {
    mainFrame.i = i;
    snap(19, i === 0 ? `The loop starts with i = 0. Check 0 < ${N} → true.` : `i++ → i = ${i}. Check ${i} < ${N} → true.`);
    cur = [];
    curRet = [];
    trees.push(cur);
    snap(20, `Call fibonacci(${i}) to get the value to print. main() waits here.`);
    const v = rec(i, 'main', 0, null);
    out.push(v);
    snap(20, `fibonacci(${i}) returned ${v}. printf prints "${v} ".`, { printed: true });
  }
  mainFrame.i = N;
  snap(19, `i++ → i = ${N}. Check ${N} < ${N} → false, so the loop ends.`);
  snap(23, `return 0. The program ends. Total calls to fibonacci: ${trees.reduce((t, tr) => t + tr.length, 0)}.`);

  trees.forEach(tree => {
    let leaf = 0;
    const lay = id => {
      const nd = tree[id];
      if (!nd.kids.length) { nd.x = leaf++; return; }
      nd.kids.forEach(lay);
      nd.x = (tree[nd.kids[0]].x + tree[nd.kids[nd.kids.length - 1]].x) / 2;
    };
    lay(0);
    const seenArgs = new Set();
    tree.forEach(nd => { nd.rep = seenArgs.has(nd.k); seenArgs.add(nd.k); });
  });
  return { steps, trees };
}

function hl(src) {
  const parts = [];
  const re = /(#include\s*<[^>]+>)|(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(int|if|return|for)\b|\b(fibonacci|printf|main)\b|\b(\d+)\b/g;
  let last = 0, m, key = 0;
  while ((m = re.exec(src))) {
    if (m.index > last) parts.push(src.slice(last, m.index));
    const cls = m[1] ? 'tk-pp' : m[2] ? 'tk-cm' : m[3] ? 'tk-str' : m[4] ? 'tk-kw' : m[5] ? 'tk-fn' : 'tk-num';
    parts.push(html`<span key=${key++} className=${cls}>${m[0]}</span>`);
    last = m.index + m[0].length;
  }
  if (last < src.length) parts.push(src.slice(last));
  if (!parts.length) parts.push(' ');
  return parts;
}

function Tree({ tree, s }) {
  if (!tree || s.seen === 0) return html`<div className="noTree">The tree grows here once main() calls fibonacci(i).</div>`;
  const leafW = 106, rowH = 60, padX = 56, padY = 16, w = 98, h = 38;
  const maxX = Math.max(...tree.map(nd => nd.x));
  const maxD = Math.max(...tree.map(nd => nd.depth));
  const W = padX * 2 + maxX * leafW;
  const H = padY * 2 + maxD * rowH + h;
  const VW = Math.max(W, 1000), VH = Math.max(H, 250);
  const ox = (VW - W) / 2;
  const X = nd => ox + padX + nd.x * leafW;
  const Y = nd => padY + nd.depth * rowH;
  const fibFrames = s.stack.filter(f => !f.main);
  const activeId = fibFrames.length ? fibFrames[fibFrames.length - 1].id : null;
  const onStack = new Set(fibFrames.map(f => f.id));
  const visible = tree.filter(nd => nd.id < s.seen);
  return html`
    <svg viewBox=${`0 0 ${VW} ${VH}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label="Recursion tree of fibonacci calls">
      ${visible.filter(nd => nd.parent != null).map(nd => {
        const p = tree[nd.parent];
        const x1 = X(p), y1 = Y(p) + h, x2 = X(nd), y2 = Y(nd);
        const my = (y1 + y2) / 2, mx = (x1 + x2) / 2;
        return html`<g key=${'e' + nd.id} className="t-appear">
          <path className=${'t-edge' + (onStack.has(nd.id) ? ' live' : '')} d=${`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`} />
          <text className="t-elbl" x=${mx + (x2 < x1 ? -6 : 6)} y=${my + 4} textAnchor=${x2 < x1 ? 'end' : 'start'}>${nd.via}</text>
        </g>`;
      })}
      ${visible.map(nd => {
        const isActive = nd.id === activeId;
        const cls = isActive ? 'active' : onStack.has(nd.id) ? 'stack' : s.rets[nd.id] != null ? 'done' : '';
        let sub = '';
        if (isActive) sub = s.lines.length ? `▶ line ${s.lines.join('–')}` : '';
        else if (onStack.has(nd.id)) sub = 'waits at L13';
        else if (nd.rep) sub = 'repeat';
        const x = X(nd), y = Y(nd);
        return html`<g key=${'n' + nd.id} className=${'t-node t-appear ' + cls + (nd.rep ? ' rep' : '')}>
          <rect x=${x - w / 2} y=${y} width=${w} height=${h} rx="8" />
          <text className="t-call" x=${x} y=${y + 16} textAnchor="middle">fib(${nd.k})</text>
          <text className="t-sub" x=${x} y=${y + 30} textAnchor="middle">${sub}</text>
          ${s.rets[nd.id] != null && html`<g className="t-ret">
            <circle cx=${x + w / 2 - 2} cy=${y + 2} r="10" />
            <text x=${x + w / 2 - 2} y=${y + 6} textAnchor="middle">${s.rets[nd.id]}</text>
          </g>`}
        </g>`;
      })}
    </svg>`;
}

function State({ s, N, trees }) {
  const mainF = s.stack.find(f => f.main);
  const i = mainF ? mainF.i : null;
  const tree = trees[s.ti];
  const fibFrames = s.stack.filter(f => !f.main);
  const top = fibFrames[fibFrames.length - 1];
  const done = s.out.length;
  let bars = null;
  if (tree && s.ti >= 0) {
    const ks = [];
    for (let k = s.ti; k >= 0; k--) ks.push(k);
    const now = {}, fin = {};
    tree.forEach(nd => {
      fin[nd.k] = (fin[nd.k] || 0) + 1;
      if (nd.id < s.seen) now[nd.k] = (now[nd.k] || 0) + 1;
    });
    const maxC = Math.max(...Object.values(fin));
    const before = trees.slice(0, s.ti).reduce((t, tr) => t + tr.length, 0);
    bars = html`
      <div className="barsTitle">
        <span>Times each fibonacci(k) was called inside fibonacci(${s.ti})</span>
        <span>calls: <b>${s.seen}</b> here, <b>${before + s.seen}</b> in total</span>
      </div>
      <div className="bars">
        ${ks.map(k => html`<div key=${k} className="cbar">
          <span className="c">${now[k] || 0}</span>
          <div className=${'fill' + (top && top.k === k ? ' hot' : '')} style=${{ height: ((now[k] || 0) / maxC * 100) + '%' }} />
        </div>`)}
      </div>
      <div className="barlbls">${ks.map(k => html`<span key=${k}>fib(${k})</span>`)}</div>`;
  } else {
    bars = html`<div className="barsTitle"><span>Call counts appear once the first fibonacci(i) call starts.</span></div><div className="bars" />`;
  }
  return html`
    <div className="seq">
      ${Array.from({ length: N }, (_, k) => {
        const cls = k < done ? 'done' + (s.printed && k === done - 1 ? ' fresh' : '') : (k === i && k === done && s.ti === k) ? 'cur' : '';
        return html`<div key=${k} className=${'cell ' + cls}><div className="k">i=${k}</div><div className="v">${k < done ? s.out[k] : k === i && cls === 'cur' ? '?' : ''}</div></div>`;
      })}
    </div>
    <div className="barsWrap">${bars}</div>`;
}

function App() {
  const [N, setN] = useState(7);
  const { steps, trees } = useMemo(() => buildSteps(N), [N]);
  const code = useMemo(() => codeFor(N), [N]);
  const [idx, setIdx] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(7);
  const stackRef = useRef(null);
  const delay = 2200 - speed * 200;
  const last = steps.length - 1;
  const s = steps[Math.min(idx, last)];
  const mainF = s.stack.find(f => f.main);
  const fibFrames = s.stack.filter(f => !f.main);
  const top = fibFrames[fibFrames.length - 1];

  useEffect(() => {
    if (!playing) return;
    if (idx >= last) { setPlaying(false); return; }
    const t = setTimeout(() => setIdx(i => Math.min(i + 1, last)), delay);
    return () => clearTimeout(t);
  }, [playing, idx, delay, last]);

  useEffect(() => {
    if (stackRef.current) stackRef.current.scrollTop = 0;
  }, [idx, N]);

  const togglePlay = () => {
    if (playing) { setPlaying(false); return; }
    if (idx >= last) setIdx(0);
    setPlaying(true);
  };
  const nextPrint = () => {
    setPlaying(false);
    let j = idx + 1;
    while (j < last && !steps[j].printed) j++;
    setIdx(Math.min(j, last));
  };

  useEffect(() => {
    const onKey = e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') { setPlaying(false); setIdx(i => Math.min(i + 1, last)); }
      else if (e.key === 'ArrowLeft') { setPlaying(false); setIdx(i => Math.max(i - 1, 0)); }
      else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const pickN = k => { setPlaying(false); setIdx(0); setN(k); };
  const active = new Set(s.lines);
  const paused = new Set(s.stack.slice(0, -1).map((f, p) => s.stack[p + 1].via === 'main' ? 20 : 13));
  const lineLabel = s.lines.length ? 'Line ' + s.lines.join('–') : '—';
  const v = (k, val) => html`<span className="var">${k}=<b>${val}</b></span>`;
  const q = x => x == null ? '?' : x;

  return html`
    <div className="app">
      <div className="bar">
        <h1>Fibonacci dry run</h1>
        <div className="group">
          <span className="lbl">n</span>
          ${[1, 2, 3, 4, 5, 6, 7].map(k => html`<button key=${k} className=${k === N ? 'on' : ''} onClick=${() => pickN(k)} aria-pressed=${k === N}>${k}</button>`)}
        </div>
        <div className="group">
          <button onClick=${() => { setPlaying(false); setIdx(0); }} disabled=${idx === 0} aria-label="Restart">⏮</button>
          <button onClick=${() => { setPlaying(false); setIdx(i => Math.max(i - 1, 0)); }} disabled=${idx === 0} aria-label="Previous step">◀</button>
          <button className="play" onClick=${togglePlay}>${playing ? 'Pause' : idx >= last ? 'Replay' : 'Play'}</button>
          <button onClick=${() => { setPlaying(false); setIdx(i => Math.min(i + 1, last)); }} disabled=${idx >= last} aria-label="Next step">▶</button>
          <button onClick=${nextPrint} disabled=${idx >= last}>Next print</button>
        </div>
        <div className="group">
          <span className="lbl">Speed</span>
          <input type="range" min="1" max="10" value=${speed} onChange=${e => setSpeed(+e.target.value)} aria-label="Playback speed" />
        </div>
        <div className="scrub">
          <input type="range" min="0" max=${last} value=${idx} onChange=${e => { setPlaying(false); setIdx(+e.target.value); }} aria-label="Step" />
          <span className="stepno">Step ${idx + 1} / ${steps.length}</span>
        </div>
      </div>

      <main className="main">
        <section className="panel state">
          <div className="panel-head"><span>Printed sequence</span><small>${s.out.length} / ${N} printed</small></div>
          <${State} s=${s} N=${N} trees=${trees} />
          <div className="narration" aria-live="polite">
            <span className=${'linebadge' + (s.lines.length ? '' : ' none')}>${lineLabel}</span>
            <p>${s.msg}</p>
          </div>
        </section>

        <section className="side">
          <div className="panel">
            <div className="panel-head"><span>Call stack</span><small>depth ${s.stack.length}</small></div>
            <div className="body stack" ref=${stackRef}>
              ${s.stack.length === 0
                ? html`<div className="empty">Empty. The program has finished.</div>`
                : s.stack.slice().reverse().map((f, j) => {
                    const isTop = j === 0;
                    const pos = s.stack.length - 1 - j;
                    const child = s.stack[pos + 1];
                    return html`<div key=${pos} className=${'frame' + (isTop ? ' active' : '')}>
                      ${f.main
                        ? html`<span>main()</span><span className="cnt">n = ${f.n}, i = ${f.i == null ? '—' : f.i}</span>`
                        : html`<span>fibonacci(${f.k})</span><span className="cnt">${f.k >= 2 ? `${q(f.a)} + ${q(f.b)}` : 'base case'}</span>`}
                      ${!isTop && html`<span className="wait">${f.main ? `waiting at line 20 for fibonacci(${child.k})` : `waiting at line 13 for fibonacci(${child.via})`}</span>`}
                    </div>`;
                  })}
            </div>
          </div>
          <div className="panel">
            <div className="panel-head"><span>Output</span><small>stdout</small></div>
            <div className="body console term">
              <div className="prompt">$ ./a.out</div>
              <div className="outline">
                ${s.out.map((x, j) => html`<span key=${j} className=${s.printed && j === s.out.length - 1 ? 'fresh' : ''}>${x}</span>`)}
              </div>
            </div>
          </div>
        </section>

        <section className="panel codep">
          <div className="panel-head">
            <span>fib.c</span>
            <span className="vars">
              ${v('i', mainF && mainF.i != null ? mainF.i : '—')}
              ${v('n', top ? top.k : mainF ? mainF.n : '—')}
              ${v('fib(n-1)', top && top.k >= 2 ? q(top.a) : '—')}
              ${v('fib(n-2)', top && top.k >= 2 ? q(top.b) : '—')}
              ${s.ret != null && html`<span className="var ret">returns <b>${s.ret}</b></span>`}
            </span>
          </div>
          <div className="body code">
            ${code.map((src, i) => {
              const no = i + 1;
              if (!src.trim()) return html`<div key=${no} className="ln blank" />`;
              const cls = active.has(no) ? ' active' : paused.has(no) ? ' paused' : '';
              return html`<div key=${no} className=${'ln' + cls}><span className="g">${no}</span><pre>${hl(src)}</pre></div>`;
            })}
          </div>
        </section>

        <section className="panel treep">
          <div className="panel-head">
            <span>Recursion tree${s.ti >= 0 ? ` for fibonacci(${s.ti})` : ''} <small>${s.ti >= 0 ? `calls made ${s.seen} / ${trees[s.ti].length}` : ''}</small></span>
            <span className="legend">
              <span><i style=${{ background: 'var(--marker)' }}></i>running now</span>
              <span><i style=${{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}></i>on the stack</span>
              <span><i style=${{ background: 'var(--code-bg)', border: '1px solid var(--line)' }}></i>finished</span>
              <span><i style=${{ background: 'transparent', border: '1.5px dashed var(--muted)' }}></i>repeated call</span>
              <span><i style=${{ background: '#29a36a', borderRadius: '50%' }}></i>returned value</span>
            </span>
          </div>
          <div className="treebox"><${Tree} tree=${trees[s.ti]} s=${s} /></div>
        </section>
      </main>
      <footer className="sk-foot sk-fib"><span className="sk-bars" aria-hidden="true"><i style=${{height:"2px"}}></i><i style=${{height:"2px"}}></i><i style=${{height:"4px"}}></i><i style=${{height:"6px"}}></i><i style=${{height:"10px"}}></i><i style=${{height:"16px"}}></i></span><span>© 2026 Soumik Karmakar</span></footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
